version: '3.8'

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.8.0}
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.allowemptyservices=true
      - --providers.swarm.network=marketplace-edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.fields.headers.defaultmode=drop
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/resolv.conf:/etc/resolv.conf:ro
      - certificates:/letsencrypt
    networks: [edge]
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager, node.labels.marketplace.data == true]
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      labels:
        traefik.enable: 'false'

networks:
  edge:
    external: true
    name: marketplace-edge
volumes:
  certificates:
    external: true
    name: marketplace-traefik-certificates
