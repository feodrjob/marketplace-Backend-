version: "3.9"

networks:
  traefik-public:
    external: true

volumes:
  traefik-certs:

services:
  traefik:
    image: traefik:v2.11
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/marketplace/infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-certs:/certs
    networks:
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        order: stop-first
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
