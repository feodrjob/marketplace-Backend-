server:
  port: ${SERVER_PORT:8083}

catalog:
  auth:
    base-url: ${AUTH_BASE_URL:http://localhost:8081}
  search:
    initialize-on-startup: ${CATALOG_SEARCH_INITIALIZE_ON_STARTUP:true}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketplace?currentSchema=catalog,public}
    username: ${SPRING_DATASOURCE_USERNAME:marketplace}
    password: ${SPRING_DATASOURCE_PASSWORD:marketplace}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
    open-in-view: false
  flyway:
    enabled: true
    schemas:
      - catalog
    default-schema: catalog
    locations:
      - classpath:db/migration
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 5s
  data:
    elasticsearch:
      repositories:
        enabled: false
