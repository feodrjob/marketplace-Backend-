name: Deploy to VM

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: marketplace-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Update main and restart services
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          ssh -T -p "$DEPLOY_PORT" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -- "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'DEPLOY'
          set -euo pipefail
          cd "$HOME/marketplace-backend"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'The deployment checkout has changes to tracked files.' >&2
            exit 1
          fi
          export GIT_TERMINAL_PROMPT=0
          git switch main
          git fetch origin main
          git merge --ff-only FETCH_HEAD
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo 'The local main branch contains commits absent from origin/main.' >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'The deployment checkout has untracked files.' >&2
            exit 1
          fi
          git rev-parse HEAD
          if ! docker compose up --build --remove-orphans --wait --wait-timeout 180; then
            docker compose ps -a
            exit 1
          fi
          docker compose ps
          DEPLOY
