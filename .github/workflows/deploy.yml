name: Deploy backend to Swarm

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN || '87.242.102.190.nip.io' }}
      CATALOG_REPLICAS: ${{ vars.CATALOG_REPLICAS || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Skip superseded commits
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping an older commit.'
          fi
      - name: Upload release and deploy
        if: steps.head.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$APP_DOMAIN" =~ ^[a-z0-9.-]+$ ]]
          [[ "$CATALOG_REPLICAS" =~ ^[01]$ ]]
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "$owner" =~ ^[a-z0-9-]+$ ]]
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          options=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release=".marketplace-swarm/releases/backend-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -p "$DEPLOY_PORT" "${options[@]}" "$target" "umask 077; mkdir -p '$release'"
          scp -P "$DEPLOY_PORT" "${options[@]}" \
            deploy/release.sh deploy/swarm/backend.yml "$target:$release/"
          printf '%s\n' "$GHCR_TOKEN" | ssh -T -p "$DEPLOY_PORT" "${options[@]}" "$target" \
            "APP_DOMAIN='$APP_DOMAIN' GHCR_OWNER='$owner' CATALOG_REPLICAS='$CATALOG_REPLICAS' bash '$release/release.sh' '$GITHUB_SHA' '$GITHUB_ACTOR'"
