name: Deploy to VM

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: marketplace-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:

      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > "$RUNNER_TEMP/vm" <<'SSH'
          #!/usr/bin/env bash
          exec ssh -T -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "$@"
          SSH
          chmod 700 "$RUNNER_TEMP/vm"

      - name: Update main on VM
        id: update
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          "$RUNNER_TEMP/vm" "bash -se -- '$DEPLOY_SHA'" <<'DEPLOY' | tee "$RUNNER_TEMP/update.log"
          set -euo pipefail
          cd "$HOME/marketplace-backend"
          git fetch origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$1" ]]; then
            echo 'Skipping: main has a newer commit to deploy.'
            exit 0
          fi
          git switch main
          git merge --ff-only "$1"
          echo 'DEPLOY_READY=true'
          DEPLOY
          if grep -qx 'DEPLOY_READY=true' "$RUNNER_TEMP/update.log"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build images on VM
        if: steps.update.outputs.ready == 'true'
        run: |
          "$RUNNER_TEMP/vm" 'bash -se' <<'DEPLOY'
          cd "$HOME/marketplace-backend"
          docker compose --progress plain build
          DEPLOY

      - name: Start containers and wait for health checks
        if: steps.update.outputs.ready == 'true'
        run: |
          "$RUNNER_TEMP/vm" 'bash -se' <<'DEPLOY'
          cd "$HOME/marketplace-backend"
          docker compose up --no-build --remove-orphans --wait --wait-timeout 180
          DEPLOY
