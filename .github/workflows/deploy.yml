name: Deploy to VM

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketplace-vm
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      REGISTRY_HOST: pmtbank.cr.cloud.ru
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check that the tested commit is still main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          echo "current=$([[ "$head_sha" == "$DEPLOY_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH and detect VM architecture
        if: steps.latest.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          # Retry establishing a shared connection; execute each remote command once.
          {
            printf '#!/usr/bin/env bash\nset -euo pipefail\nssh_base=('
            printf '%q ' ssh -T -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/deploy-ssh/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" \
              -o "ControlPath=$RUNNER_TEMP/deploy-ssh/control" -o ControlPersist=3600 \
              -o ConnectionAttempts=1 -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4
            printf ')\ndestination=%q\n' "$DEPLOY_USER@$DEPLOY_HOST"
            cat <<'CONNECT'
          for attempt in {1..11}; do
            if "${ssh_base[@]}" -O check "$destination" >/dev/null 2>&1; then
              break
            fi
            if "${ssh_base[@]}" -M -N -f "$destination" </dev/null; then
              break
            else
              status=$?
            fi
            if (( attempt == 11 )); then
              echo 'SSH connection failed after 11 attempts.' >&2
              exit "$status"
            fi
            echo "SSH connection attempt $attempt/11 failed; retrying in 5 seconds." >&2
            sleep 5
          done
          # If the master dies here, fail instead of replaying a remote operation.
          exec "${ssh_base[@]}" -o ProxyCommand=false -- "$destination" "$@"
          CONNECT
          } > "$RUNNER_TEMP/deploy-ssh/connect"
          chmod 700 "$RUNNER_TEMP/deploy-ssh/connect"
          arch="$("$RUNNER_TEMP/deploy-ssh/connect" 'set -eu; test -r "$HOME/marketplace-backend/.env"; command -v flock >/dev/null; command -v sha256sum >/dev/null; docker compose version >/dev/null; docker info --format "{{.Architecture}}"')"
          case "$arch" in
            x86_64|amd64) echo 'VM_PLATFORM=linux/amd64' >> "$GITHUB_ENV" ;;
            aarch64|arm64) echo 'VM_PLATFORM=linux/arm64' >> "$GITHUB_ENV" ;;
            *) echo "Unsupported VM architecture: $arch" >&2; exit 1 ;;
          esac

      - uses: docker/setup-qemu-action@v3
        if: steps.latest.outputs.current == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.latest.outputs.current == 'true'

      - name: Log in to Cloud.ru registry
        if: steps.latest.outputs.current == 'true'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${REGISTRY_USERNAME:?Missing REGISTRY_USERNAME secret (Cloud.ru Key ID)}"
          : "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD secret (Cloud.ru Key Secret)}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Publish all Compose images to Cloud.ru
        if: steps.latest.outputs.current == 'true'
        run: python3 deploy/package.py "$DEPLOY_SHA" "$VM_PLATFORM" "$REGISTRY_HOST" "$RUNNER_TEMP/deploy-bundle"

      - name: Transfer release configuration and deploy from registry
        if: steps.latest.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_PROJECT_NAME: ${{ vars.DEPLOY_PROJECT_NAME }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$head_sha" != "$DEPLOY_SHA" ]]; then
            echo 'Skipping deployment: main has a newer commit awaiting CI.'
            exit 0
          fi
          remote() {
            local command
            printf -v command '%q ' "$@"
            "$RUNNER_TEMP/deploy-ssh/connect" "$command"
          }
          # Each attempt has its own upload directory. Remove it on success or failure.
          stage="$("$RUNNER_TEMP/deploy-ssh/connect" 'umask 077; mkdir -p "$HOME/.marketplace-deploy"; mktemp -d "$HOME/.marketplace-deploy/incoming.XXXXXXXX"')"
          [[ "$stage" == /*/.marketplace-deploy/incoming.* ]]
          trap 'remote rm -rf -- "$stage" || true' EXIT
          # This bundle contains only configuration and the installer, no images.
          tar -C "$RUNNER_TEMP/deploy-bundle" -cf - . | remote tar -C "$stage" -xf -
          # Send credentials over encrypted stdin, never as remote command arguments.
          printf '%s\n%s\n' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | \
            remote bash -c 'set -euo pipefail; umask 077; IFS= read -r registry_user; docker --config "$1" login "$2" --username "$registry_user" --password-stdin' \
              bash "$stage/docker-config" "$REGISTRY_HOST"
          remote bash "$stage/install.sh" "$stage" "$DEPLOY_SHA" "$DEPLOY_PROJECT_NAME"

      - name: Remove registry and SSH credentials
        if: always()
        run: |
          if [[ -S "$RUNNER_TEMP/deploy-ssh/control" ]]; then
            ssh -S "$RUNNER_TEMP/deploy-ssh/control" -O exit ignored || true
          fi
          docker logout "$REGISTRY_HOST" || true
          rm -rf -- "$RUNNER_TEMP/deploy-ssh"
