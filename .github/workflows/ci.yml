name: Backend CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: All modules tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace
      SPRING_DATASOURCE_USERNAME: marketplace
      SPRING_DATASOURCE_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Test and build all modules
        shell: bash
        run: |
          build_log="$RUNNER_TEMP/gradle-build.log"
          for attempt in 1 2 3; do
            set +e
            sh ./gradlew --no-daemon --console=plain --max-workers=2 build 2>&1 | tee "$build_log"
            build_status=${PIPESTATUS[0]}
            set -e

            if [ "$build_status" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ] || ! grep -q 'Received status code 429 from server' "$build_log"; then
              exit "$build_status"
            fi

            delay=$((attempt * 60))
            echo "::warning::Dependency repository returned HTTP 429; retrying in ${delay}s (attempt $((attempt + 1))/3)"
            sleep "$delay"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
