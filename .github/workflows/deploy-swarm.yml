name: Deploy

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload stack file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 87.242.102.190
          username: krefature
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "infra/app-stack.yml"
          target: "/opt/marketplace/"
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 87.242.102.190
          username: krefature
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/marketplace

            set -a; source /opt/marketplace/.env; set +a
            docker stack deploy \
              -c /opt/marketplace/app-stack.yml \
              --with-registry-auth \
              --resolve-image always \
              --detach=false \
              marketplace

            # Auth/catalog use Flyway on Spring startup; no Prisma commands.
